name: Build Mobile Apps (APK & iOS)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: |
          npm --prefix client install
          npm --prefix client run build

      - name: Sync Capacitor Android
        run: |
          cd client
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd client/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QLingo-Android-APK
          path: client/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  build-ios:
    name: Build iOS Project & Archive
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies & Build Web
        run: |
          npm --prefix client install
          npm --prefix client run build

      - name: Sync Capacitor iOS
        run: |
          cd client
          npx cap sync ios

      - name: Build iOS Xcode Workspace
        run: |
          cd client/ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -destination generic/platform=iOS clean build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Upload iOS Xcode Project
        uses: actions/upload-artifact@v4
        with:
          name: QLingo-iOS-Workspace
          path: client/ios/App/App.xcworkspace
